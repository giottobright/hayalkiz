# Full stack: backend + Mini App + PostgreSQL (pgvector) + Redis.
#   git submodule update --init --recursive
#   cp back/.env.example back/.env        # fill TELEGRAM_BOT_TOKEN, OPENAI_API_KEY, DB_PASSWORD, WEBAPP_URL,
#                                         # WEBHOOK_URL and PUBLIC_API_URL
#   docker compose --env-file back/.env up -d --build
# Put a TLS reverse proxy in front: api.example.com → :8000, app.example.com → :8080.
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hayalkiz}
      POSTGRES_USER: ${DB_USER:-hayalkiz}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD (same value as in back/.env)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hayalkiz} -d ${DB_NAME:-hayalkiz}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  bot:
    build: ./back
    restart: unless-stopped
    env_file: back/.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_SSLMODE: disable
      REDIS_URL: redis://redis:6379/0
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  webapp:
    build:
      context: ./webapp
      args:
        VITE_API_BASE: ${PUBLIC_API_URL:?set PUBLIC_API_URL in back/.env}
    restart: unless-stopped
    ports:
      - "8080:80"

volumes:
  pgdata:
